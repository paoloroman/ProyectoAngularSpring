<div class="card">
    <div class="card-content">
        <div class="card-header">
            <h5 class="card-title">Form {{(user.id > 0)? 'Update': 'Create'}} User</h5>
        </div>
        <div class="card-body">

            <form (ngSubmit)="onSubmit(userForm)" #userForm="ngForm">

                <div>
                    <input placeholder="Name" name="name" [(ngModel)]="user.nombre" class="form-control my-2"
                        #name="ngModel">
                    <!-- required esto lo quitamos para que java lo valide la entrada desde angular-->

                    @if(errors?.nombre){
                    <div class="text-danger">{{ errors.nombre }}</div>
                    }

                </div>
                <div>
                    <input placeholder="Lastname" name="lastname" [(ngModel)]="user.apellidos" class="form-control my-2"
                        #lastname="ngModel">
                    <!-- required esto lo quitamos para que java lo valide la entrada desde angular-->
                    @if(errors?.apellidos){
                    <div class="text-danger">{{ errors.apellidos }}</div>
                    }
                </div>

                <div>
                    <input placeholder="Email" name="email" [(ngModel)]="user.email" class="form-control my-2"
                        type="email" #email="ngModel">
                    <!-- required email esto lo quitamos para que java lo valide la entrada desde angular-->
                    @if(errors?.email){
                    <div class="text-danger">{{ errors.email }}</div>
                    }



                    <!--@if (email.invalid && (email.dirty || email.touched)) {
                        @if(email.errors!['required']){
                        <div class="text-danger">
                            El email es requerido
                        </div>
                        }
                        @if(email.errors!['email']){
                        <div class="text-danger">
                            El email no tiene formato correcto!
                        </div>
                        }
                    } -->
                </div>
                <div>
                    <input placeholder="Username" name="username" [(ngModel)]="user.usuario" class="form-control my-2"
                        #username="ngModel"><!-- required minlength="8" esto lo quitamos para que java lo valide la entrada desde angular-->

                        @if(errors?.usuario){
                        <div class="text-danger">{{ errors.usuario }}</div>
                        }
                   <!-- @if (username.invalid && (username.dirty || username.touched)) {
                    @if(username.errors!['required']){
                    <div class="text-danger">
                        El usuario es requerido
                    </div>
                    }
                    @if(username.errors!['minlength']){
                    <div class="text-danger">
                        Usuario debe de tener al menos 8 caracteres!
                    </div>
                    }
                    }-->
                </div>
                @if( user.id == 0){
                <div>
                    <input placeholder="Password" name="password" type="password" [(ngModel)]="user.pwd"
                        class="form-control my-2" #password="ngModel">
                    <!-- required minlength="6" esto lo quitamos para que java lo valide la entrada desde angular-->

                    @if(errors?.pwd){
                        <div class="text-danger">{{ errors.pwd }}</div>
                    }
                   <!-- @if (password.invalid && (password.dirty || password.touched)) {
                    @if(password.errors!['required']){
                    <div class="text-danger">
                        El password es requerido
                    </div>
                    }
                    @if(password.errors!['minlength']){
                    <div class="text-danger">
                        Password debe de tener al menos 6 caracteres!
                    </div>
                    }
                }-->
                </div>
            }
                <div>
                    <button type="submit" class="btn btn-primary m-2" > <!-- [disabled]="userForm.invalid" -->
                        {{(user.id > 0)? 'Update': 'Create'}}
                    </button>

                    <button type="button" class="btn btn-secondary my-2" (click)="onClear(userForm)">
                        Clear
                    </button>
                </div>

            </form>
        </div>

    </div>
</div>
